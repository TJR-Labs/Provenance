name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  DIRECT_URL: postgresql://ci:ci@localhost:5432/ci
  AUTH_SECRET: ci-dummy-secret
  SUPABASE_URL: https://ci-dummy.supabase.co
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
  SUPABASE_STORAGE_BUCKET: project-media
  SUPABASE_STORAGE_STAGING_BUCKET: upload-staging
  # RESEND_API_KEY / EMAIL_FROM intentionally unset: no sending domain yet,
  # and the build/app must work without them (see README).

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
